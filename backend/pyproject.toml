[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphrag-assessment-backend"
version = "0.1.0"
description = "FastAPI service for the GraphRAG technical assessment"
requires-python = ">=3.11"
dependencies = [
  # FastAPI Cloud invokes the `fastapi` CLI, which is supplied by the standard extra.
  "fastapi[standard]>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langgraph>=0.4,<1.0",
  "neo4j>=5.26,<6.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "pypdf>=5.0,<7.0",
  "qdrant-client>=1.12,<2.0",
  "python-multipart>=0.0.18,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

# Tests live in the repository-level /tests directory; see ../pytest.ini.

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Lint configuration is repository-level; see ../ruff.toml.
