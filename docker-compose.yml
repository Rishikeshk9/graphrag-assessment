services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6343:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The Qdrant image ships neither curl nor wget, so probe the REST port
      # with bash's /dev/tcp redirection instead.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/local-rag-password
    ports:
      - "7475:7474"
      - "7690:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: local-rag-password
      # Ollama remains on the host so the local model weights are never copied
      # into a container image.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Embeddings and answers stay local; the graph extractor is an optional
      # OpenRouter structured-output model selected with these variables.
      GRAPH_EXTRACTION_PROVIDER: ${GRAPH_EXTRACTION_PROVIDER:-ollama}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-stealth/ox-alpha}
      OPENROUTER_GRAPH_MODEL: ${OPENROUTER_GRAPH_MODEL:-stealth/ox-alpha}
      OPENROUTER_GRAPH_RESPONSE_FORMAT: ${OPENROUTER_GRAPH_RESPONSE_FORMAT:-json_object}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://127.0.0.1:5173}
      OPENROUTER_APP_NAME: GraphRAG Assessment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8080"
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional Linux-only model runtime. macOS users should keep Ollama on the
  # host to use Apple Metal acceleration and set OLLAMA_URL accordingly.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  qdrant_data:
  neo4j_data:
  ollama_data:
